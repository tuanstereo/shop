name: CI PIpeline
on:
  push:
    branches: [main]
jobs:
  build:
    if: contains(github.event.head_commit.message, 'chore:release/')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build the application
        run: npm run build
      - name: Login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            tuanvo2512/webshop-fe:latest
            tuanvo2512/webshop-fe:${{ github.sha }}  
      - name: deploy to server
        run: |
          docker pull tuanvo2512/webshop-fe:latest
          docker stop webshop-fe || true
          docker rm webshop-fe || true
          docker run -d -p 3000:3000 --name webshop-fe tuanvo2512/webshop-fe:latest